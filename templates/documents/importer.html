{% extends "base.html" %}

{% block titre %}Importer un document{% endblock %}

{% block contenu %}
  <h1>Importer un document de cours</h1>
  <p class="aide">Formats acceptés : DOCX, PDF, PPTX, XLSX. Taille maximale : 10 Mo.</p>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Importer</button>
  </form>
  <p><a href="{% url 'documents:liste' %}">Voir les documents importés</a></p>
{% endblock %}
