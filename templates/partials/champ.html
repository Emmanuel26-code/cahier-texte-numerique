{% comment %}Un champ de formulaire : libellé, saisie, aide et erreurs. Variable : champ.{% endcomment %}
<div class="champ{% if mdp %} champ-mdp-bloc{% endif %}">
  <label for="{{ champ.id_for_label }}">{{ champ.label }}</label>
  {% if mdp %}
    <div class="champ-mdp">
      {{ champ }}
      <button type="button" class="voir-mdp" data-voir-mdp="{{ champ.id_for_label }}" aria-label="Afficher le mot de passe" aria-pressed="false">
        <svg class="oeil-ouvert" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="oeil-ferme" hidden width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18M10.6 6.1A10.6 10.6 0 0 1 12 6c6.4 0 10 6 10 6a17 17 0 0 1-3.2 3.9M6.2 6.6C3.6 8.3 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 4.4-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
      </button>
    </div>
  {% else %}
    {{ champ }}
  {% endif %}
  {% if champ.help_text %}<div class="form-help">{{ champ.help_text|safe }}</div>{% endif %}
  {% for erreur in champ.errors %}<p class="form-error">{{ erreur }}</p>{% endfor %}
</div>
