<!doctype html>
<html lang="fr">
<body style="margin:0;padding:24px 12px;background:#f5f7fb;font-family:Arial,Helvetica,sans-serif;color:#1f2937">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:16px;border:1px solid #e4e7ec">
    <tr><td style="padding:28px 28px 8px">
      <div style="display:inline-block;padding:8px 10px;border-radius:10px;background:#2864f0;color:#ffffff;font-weight:bold;font-size:14px">CT</div>
      <h1 style="margin:18px 0 8px;font-size:22px;color:#1f2937">Votre compte est validé</h1>
      <p style="margin:0 0 16px;font-size:15px;line-height:1.5;color:#344054">Bonjour{% if user.first_name %} {{ user.first_name }}{% endif %}, l’administration a validé votre compte professeur. Vous pouvez maintenant vous connecter.</p>
    </td></tr>
    <tr><td style="padding:0 28px 8px">
      <a href="{{ lien }}" style="display:inline-block;padding:13px 24px;border-radius:999px;background:#2864f0;color:#ffffff;text-decoration:none;font-weight:bold;font-size:15px">Se connecter</a>
    </td></tr>
    <tr><td style="padding:16px 28px 28px">
      <p style="margin:0 0 10px;font-size:13px;line-height:1.5;color:#667085"></p>
      <p style="margin:0;font-size:12px;color:#98a2b3;word-break:break-all">Si le bouton ne fonctionne pas, copiez ce lien dans votre navigateur :<br>{{ lien }}</p>
    </td></tr>
  </table>
</body>
</html>
