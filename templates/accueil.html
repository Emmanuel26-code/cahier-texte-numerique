{% extends "base.html" %}

{% block contenu %}
  <h1>Cahier de texte numérique</h1>
  {% if user.is_authenticated %}
    <p>Bienvenue {{ user.first_name|default:user.username }} !</p>
  {% else %}
    <p>Connectez-vous ou créez un compte pour accéder au cahier de texte.</p>
  {% endif %}
{% endblock %}
